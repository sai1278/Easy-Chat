# redis-cluster.conf
# Redis Cluster Node Configuration Template
# Optimized for Nearby Connect: 3-Master/3-Replica horizontal sharding layout.

# =====================================================
# 1. BASIC SERVICE CONFIGURATION
# =====================================================
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# =====================================================
# 2. CLUSTERING ACTIVATION
# =====================================================
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 15000             # Time in ms before a node is considered down (Prevents failover thrashing)
cluster-replica-validity-factor 10     # Max out-of-sync gap allowed for replicas before disqualifying promotion
cluster-migration-barrier 1            # Retain at least 1 replica per master before migration kicks in
cluster-require-full-coverage no       # Keep cluster online even if a partition slot is offline (Graceful degradation)

# =====================================================
# 3. STORAGE & VOLATILITY (In-Memory Durability Tuning)
# =====================================================
maxmemory 512mb                        # Node memory ceiling limit
maxmemory-policy volatile-lru          # Evict LRU keys with an active TTL first to preserve static config slots
maxmemory-samples 5                    # Eviction precision check (5 provides good CPU vs accuracy balance)

# =====================================================
# 4. PERSISTENCE PARAMETERS
# =====================================================
# Use AOF for local transaction logging combined with RDB snapshots
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec                   # Async flush once per second (Acceptable latency trade-off)
no-appendfsync-on-rewrite yes          # Avoid blocking main client thread during disk flushes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# =====================================================
# 5. REPLICATION MANAGEMENT
# =====================================================
replica-serve-stale-data yes           # Keep serving stale data during master sync reconnects
replica-read-only yes                  # Enforce read-only replicas
repl-diskless-sync yes                 # Direct socket transfer for speed during replica sync
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
repl-backlog-size 16mb                 # Retain backlog for quick reconnects without full sync
repl-backlog-ttl 3600
replica-priority 100

# =====================================================
# 6. SECURITY CONFIGURATION
# =====================================================
tls-port 63790                         # Enable TLS interface
tls-cert-file /certs/redis.crt
tls-key-file /certs/redis.key
tls-ca-cert-file /certs/ca.crt
tls-auth-clients yes

# Load ACL database
aclfile /usr/local/etc/redis/acl.conf
