# redis-cluster-optimised.conf
# Cost-Optimised Redis Cluster Configuration
#
# Changes from baseline redis-cluster.conf:
#  - maxmemory: 512mb → 256mb per node (right-sized from actual p95 usage ~180MB)
#  - maxmemory-policy: volatile-lru → allkeys-lru (avoids wasted memory from non-TTL keys)
#  - save intervals: relaxed to reduce IOPS cost
#  - AOF rewrite: reduced from 100% → 80% growth trigger (smaller AOF files = less disk $)
#  - repl-backlog-size: 16mb → 8mb (saves ~24MB across 3 masters)
#  - tcp-backlog: 511 → 256 (sufficient for expected concurrent connections)
#  - hz: raised to 15 (faster eviction cycle, allows smaller maxmemory headroom)

port 6379
protected-mode yes
tcp-backlog 256           # was 511 — reduces socket memory overhead
timeout 60                # was 0 — close idle connections after 60s (saves fd + memory)
tcp-keepalive 60          # was 300 — detect dead connections faster

# ── Cluster ───────────────────────────────────────────────────────────────────
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 15000
cluster-replica-validity-factor 10
cluster-migration-barrier 1
cluster-require-full-coverage no

# ── Memory (Right-Sized) ──────────────────────────────────────────────────────
maxmemory 256mb           # was 512mb — p95 usage ~180MB; 256MB gives 40% headroom
maxmemory-policy allkeys-lru  # was volatile-lru — evict any LRU key (simpler + safer)
maxmemory-samples 7       # was 5 — slightly better eviction accuracy at negligible CPU cost
hz 15                     # was 10 — faster eviction scan, permits tighter maxmemory

# ── Persistence (IOPS Cost-Optimised) ────────────────────────────────────────
# Relaxed RDB saves: avoid unnecessary snapshotting on lightly-changed datasets
save 900 1
save 600 100              # was 300 10 — reduce mid-interval save frequency
# Removed: save 60 10000 — 10000 writes/60s threshold far exceeds normal traffic

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 80   # was 100 — trigger rewrite sooner, smaller file footprint
auto-aof-rewrite-min-size 32mb   # was 64mb — smaller AOF file = less disk throughput

# ── Replication ───────────────────────────────────────────────────────────────
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
repl-backlog-size 8mb     # was 16mb — saves 24MB across 3-master cluster
repl-backlog-ttl 3600
replica-priority 100

# ── Security (unchanged) ──────────────────────────────────────────────────────
tls-port 63790
tls-cert-file /certs/redis.crt
tls-key-file /certs/redis.key
tls-ca-cert-file /certs/ca.crt
tls-auth-clients yes
aclfile /usr/local/etc/redis/acl.conf

# ── Cost Estimate ─────────────────────────────────────────────────────────────
# 3-master 3-replica cluster: 256MB/node * 6 = 1.5GB total vs 3GB baseline
# On GCP Memorystore (equivalent): ~$45/mo vs ~$90/mo at n1-highmem sizing
# Recommend: cache-m4 (2GB) → cache-m1 (1GB) tier after monitoring confirms <180MB p99
