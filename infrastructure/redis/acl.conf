# acl.conf
# Access Control List (ACL) Specification for Nearby Connect Redis Nodes
# Implements the Principle of Least Privilege across app modules and monitoring.

# 1. Disable the default administrative anonymous account
user default off

# 2. Application Service Identity (nearby_app)
# Restricted to the 'nearby:*' keyspace.
# Allowed commands: read, write, geospatial, pub/sub signaling, and Lua execution.
# Revoked commands: admin operations, raw keys scanning, flushing, and shutdown.
user nearby_app on >nearby_app_production_password_placeholder ~nearby:* +@all -@admin -@dangerous -keys -flushall -flushdb

# 3. Observability Telemetry Identity (nearby_monitor)
# Read-only permission to retrieve system metrics, slow log traces, and monitoring flags.
user nearby_monitor on >nearby_monitor_production_password_placeholder ~* -@all +info +monitor +slowlog +client +ping +cluster +latency
