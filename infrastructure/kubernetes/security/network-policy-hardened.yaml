apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-easychat-infra
  namespace: easychat-infra
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: easychat-infra
