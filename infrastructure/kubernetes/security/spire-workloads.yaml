apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSpireEntry
metadata:
  name: gateway-spire-entry
spec:
  spiffeId: spiffe://cluster.local/ns/default/sa/gateway-service-account
  parentId: spiffe://cluster.local/ns/spire/sa/spire-agent
  selectors:
    - "k8s:ns:default"
    - "k8s:sa:gateway-service-account"
    - "k8s:pod-label:app:gateway-service"
