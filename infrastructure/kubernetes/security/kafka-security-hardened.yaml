apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-security-config
  namespace: easychat-infra
data:
  kafka_server_jaas.conf: |
    KafkaServer {
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="kafka_admin_secure_pass_2026"
        user_admin="kafka_admin_secure_pass_2026"
        user_easychat="easychat_client_secure_pass_2026";
    };
  server.properties.patch: |
    # Enable SASL_PLAINTEXT listener and SimpleAclAuthorizer
    listeners=PLAINTEXT://0.0.0.0:9092,SASL_PLAINTEXT://0.0.0.0:9093
    advertised.listeners=PLAINTEXT://nearby-kafka.easychat-infra.svc.cluster.local:9092,SASL_PLAINTEXT://nearby-kafka.easychat-infra.svc.cluster.local:9093
    sasl.enabled.mechanisms=PLAIN
    sasl.mechanism.inter.broker.protocol=PLAIN
    authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
    allow.everyone.if.no.acl.found=false
