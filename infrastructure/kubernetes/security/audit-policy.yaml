apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  # 1. Log Secret modifications at RequestResponse level to catch privilege tampering
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]

  # 2. Log ConfigMap changes at Request level
  - level: Request
    resources:
      - group: ""
        resources: ["configmaps"]
    verbs: ["create", "update", "patch", "delete"]

  # 3. Log all admin-level clusterRole and role binding changes
  - level: RequestResponse
    resources:
      - group: "rbac.authorization.k8s.io"
        resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]

  # 4. Log pod mutations at Metadata level (e.g. creations, deletions)
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods"]
    verbs: ["create", "delete", "update", "patch"]

  # 5. Default rule: log everything else at Metadata level to keep audit footprints lightweight
  - level: Metadata
    omitStages:
      - "RequestReceived"
