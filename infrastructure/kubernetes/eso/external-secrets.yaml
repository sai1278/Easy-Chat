apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-store
spec:
  provider:
    gcpsm:
      projectID: easychat-production-project
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: easychat-production-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store
  target:
    name: easychat-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: db_prod_password
    - secretKey: aws-access-key-id
      remoteRef:
        key: aws_prod_access_key_id
    - secretKey: aws-secret-access-key
      remoteRef:
        key: aws_prod_secret_access_key
    - secretKey: gateway-token-secret
      remoteRef:
        key: gateway_prod_token_secret
    - secretKey: rsa-private-key
      remoteRef:
        key: auth_prod_rsa_private_key
