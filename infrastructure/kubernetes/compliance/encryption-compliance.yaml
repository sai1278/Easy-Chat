## ═══════════════════════════════════════════════════════════════════════════
## Encryption Compliance Configuration
## Platform: Nearby Connect (EasyChat)
##
## Encryption standards enforced:
##   At Rest:      AES-256-GCM (CMEK via Cloud KMS)
##   In Transit:   TLS 1.3 minimum (TLS 1.2 deprecated)
##   Database:     pgcrypto for field-level encryption of PII columns
##   Kafka:        TLS + SASL/SCRAM-SHA-512
##   Redis:        TLS 1.3 + AUTH
##   Backups:      AES-256-GCM with KMS-managed keys
## ═══════════════════════════════════════════════════════════════════════════

## ─────────────────────────────────────────────────────────────────────────────
## 1. Ingress TLS Policy — Enforce TLS 1.3 minimum
## ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easychat-ingress-tls-policy
  namespace: default
  annotations:
    # NGINX: enforce TLS 1.3 minimum (deprecate TLS 1.2)
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256"
    # HSTS: 1 year with subdomains + preload
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    # Secure headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    # cert-manager: auto-rotate certificates
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/renew-before: "720h"  # Renew 30 days before expiry
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.easychat.app
        - eu.api.easychat.app
        - us.api.easychat.app
        - ap.api.easychat.app
      secretName: easychat-tls-cert
  rules:
    - host: api.easychat.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080

---
## ─────────────────────────────────────────────────────────────────────────────
## 2. Certificate Issuers — Let's Encrypt Production
## ─────────────────────────────────────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@easychat.app
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
## ─────────────────────────────────────────────────────────────────────────────
## 3. Istio PeerAuthentication — mTLS STRICT mode
##    Enforces mTLS between ALL services in the default namespace
## ─────────────────────────────────────────────────────────────────────────────
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-mtls-strict
  namespace: default
  annotations:
    gdpr.easychat.app/purpose: "in-transit-encryption"
    gdpr.easychat.app/standard: "mTLS-SPIFFE"
spec:
  mtls:
    mode: STRICT    # Reject all non-mTLS traffic between services

---
## ─────────────────────────────────────────────────────────────────────────────
## 4. Istio DestinationRule — TLS 1.3 for all egress
## ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: enforce-tls13-egress
  namespace: default
spec:
  host: "*.default.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      minProtocolVersion: TLSV1_3

---
## ─────────────────────────────────────────────────────────────────────────────
## 5. Encryption Compliance ConfigMap — Field-level encryption reference
##    PostgreSQL column encryption using pgcrypto extension
##    (applied in migration 002_field_encryption.sql)
## ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: encryption-policy
  namespace: default
  labels:
    component: compliance
  annotations:
    gdpr.easychat.app/purpose: "encryption-compliance-reference"
data:
  ## AES-256-GCM field encryption applied to these columns:
  ## users.device_id          — PII: hardware identifier
  ## user_consents.ip_address_hash — pre-hashed before storage (SHA-256)
  ## messages.content         — E2E encryption at application layer
  ##
  ## Key management:
  ##   All CMEK keys managed via Cloud KMS
  ##   Key rotation: 90-day automatic rotation
  ##   Key access: audited via Cloud Audit Logs
  ##   Key hierarchy: Master KEK → Data Encryption Keys (DEK) per-table

  encryption-standards.yaml: |
    at_rest:
      algorithm: AES-256-GCM
      key_management: Cloud KMS (CMEK)
      key_rotation_days: 90
      storage_classes:
        - eu-west1-ssd-encrypted
        - us-east1-ssd-encrypted
        - ap-southeast1-ssd-encrypted

    in_transit:
      minimum_version: TLS1.3
      cipher_suites:
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
      certificate_authority: Let's Encrypt + internal SPIFFE CA
      mtls: STRICT (Istio service mesh)

    database:
      engine: PostgreSQL 16
      extension: pgcrypto
      encrypted_columns:
        - table: users
          column: device_id
          algorithm: AES-256-GCM
        - table: user_consents
          column: ip_address_hash
          algorithm: SHA-256 (one-way hash, not reversible)
      backup_encryption: AES-256-GCM (KMS-managed)

    kafka:
      protocol: SASL_SSL
      sasl_mechanism: SCRAM-SHA-512
      ssl_protocol: TLSv1.3

    redis:
      tls: enabled
      min_version: TLSv1.3
      auth: enabled (token rotated every 30 days)

    backups:
      algorithm: AES-256-GCM
      key_source: KMS per-region
      integrity: SHA-256 checksum per backup file

  key-rotation-schedule.yaml: |
    master_kek:
      rotation_days: 365
      alert_at_days: 30

    data_encryption_keys:
      rotation_days: 90
      alert_at_days: 14

    tls_certificates:
      rotation_days: 90  # Let's Encrypt issues 90-day certs
      auto_renew_at_days: 30

    redis_auth_token:
      rotation_days: 30
      managed_by: external-secrets-operator

    kafka_scram_credentials:
      rotation_days: 90
      managed_by: external-secrets-operator
