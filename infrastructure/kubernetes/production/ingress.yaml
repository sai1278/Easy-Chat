apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easychat-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m" # Align with Media size constraints
    # Long timeouts to prevent premature WebSocket session drops
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts:
        - easychat.local
      secretName: easychat-tls-cert
  rules:
    - host: easychat.local
      http:
        paths:
          # WebSocket persistent signaling path
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080

          # REST microservices path routes
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081
          - path: /api/v1/chat
            pathType: Prefix
            backend:
              service:
                name: chat-service
                port:
                  number: 8082
          - path: /api/v1/nearby
            pathType: Prefix
            backend:
              service:
                name: nearby-service
                port:
                  number: 8083
          - path: /api/v1/presence
            pathType: Prefix
            backend:
              service:
                name: presence-service
                port:
                  number: 8084
          - path: /api/v1/user
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8085
          - path: /api/v1/media
            pathType: Prefix
            backend:
              service:
                name: media-service
                port:
                  number: 8086
          - path: /api/v1/notification
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8087
