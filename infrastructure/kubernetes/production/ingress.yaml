apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easychat-production-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "gateway-service"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "easychat_route"
spec:
  tls:
    - hosts:
        - api.easychat.com
      secretName: easychat-production-tls-secret
  rules:
    - host: api.easychat.com
      http:
        paths:
          # WebSocket persistent signaling path -> API Gateway
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080

          # REST microservices unified entry path -> API Gateway
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
