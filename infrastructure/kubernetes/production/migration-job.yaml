apiVersion: batch/v1
kind: Job
metadata:
  name: easychat-db-migration
  namespace: default
  annotations:
    helm.sh/hook: "pre-install,pre-upgrade"
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: "before-hook-creation,hook-succeeded"
    description: "Automated deterministic schema migration job executed before application pod rollout"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      name: easychat-db-migration
      labels:
        app: easychat-db-migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.0
          args:
            - "-path=/migrations"
            - "-database=$(DATABASE_URL)"
            - "up"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: easychat-secrets
                  key: database-url
          volumeMounts:
            - name: migration-files
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migration-files
          configMap:
            name: easychat-db-migrations
