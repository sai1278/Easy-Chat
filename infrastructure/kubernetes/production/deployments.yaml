apiVersion: apps/v1
kind: Deployment
metadata:
  name: nearby-service
  namespace: default
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nearby-service
  template:
    metadata:
      labels:
        app: nearby-service
    spec:
      containers:
        - name: nearby
          image: easychat/nearby:v1.0.0
          ports:
            - containerPort: 8083
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 600m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: easychat-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: easychat-secrets
                  key: database-password
