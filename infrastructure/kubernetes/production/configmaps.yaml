apiVersion: v1
kind: ConfigMap
metadata:
  name: easychat-config
  namespace: default
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  DISABLE_TLS: "false"
  TLS_CERT_FILE: "/var/run/secrets/tls/tls.crt"
  TLS_KEY_FILE: "/var/run/secrets/tls/tls.key"
  AUTH_HOSTS: "http://auth-service.default.svc.cluster.local:8081"
  USER_HOSTS: "http://user-service.default.svc.cluster.local:8085"
  CHAT_HOSTS: "http://chat-service.default.svc.cluster.local:8082"
  NEARBY_HOSTS: "http://nearby-service.default.svc.cluster.local:8088"
  PRES_HOSTS: "http://presence-service.default.svc.cluster.local:8084"
  MEDIA_HOSTS: "http://media-service.default.svc.cluster.local:8086"
  COMPLIANCE_HOSTS: "http://notification-service.default.svc.cluster.local:8087"
  KAFKA_BROKERS: "nearby-kafka.easychat-infra.svc.cluster.local:9092"
  REDIS_ADDR: "nearby-redis.easychat-infra.svc.cluster.local:6379"
  REDIS_URL: "nearby-redis.easychat-infra.svc.cluster.local:6379"
  DATABASE_HOST: "nearby-postgres.easychat-infra.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "nearby_connect"
  DATABASE_URL: "postgres://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@nearby-postgres.easychat-infra.svc.cluster.local:5432/nearby_connect?sslmode=require"
  CLAMAV_ADDRESS: "clamav-service.default.svc.cluster.local:3310"
  S3_BUCKET: "easychat-media-production"
  S3_ENDPOINT: "https://s3.us-east-1.amazonaws.com"
  AWS_REGION: "us-east-1"
  CDN_URL: "https://cdn.easychat.com"
