# ── NEW: media-service HPA (was missing) ─────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-service-hpa
  namespace: default
  annotations:
    cost-optimization/tier: "batch"
    cost-optimization/spot-eligible: "true"    # Media encoding jobs tolerate preemption
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media-service
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75   # CPU-intensive transcoding; scale earlier
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600          # 10-min cooldown; transcoding jobs finish before scale-in
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
