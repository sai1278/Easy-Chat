apiVersion: v1
kind: Secret
metadata:
  name: easychat-secrets
  namespace: default
  annotations:
    description: "Production Secret Template - Populated via external KMS / Secret Store CSI / CI-CD injection"
type: Opaque
stringData:
  # Database credentials - Injected at deployment time via ExternalSecrets / Vault
  database-username: "${DATABASE_USERNAME}"
  database-password: "${DATABASE_PASSWORD}"
  database-url: "postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@nearby-postgres.easychat-infra.svc.cluster.local:5432/nearby_connect?sslmode=require"
  
  # AWS/S3 Storage credentials - Injected via IAM Roles for Service Accounts (IRSA) / Secret Store
  aws-access-key-id: "${AWS_ACCESS_KEY_ID}"
  aws-secret-access-key: "${AWS_SECRET_ACCESS_KEY}"

  # Session signing token secrets - 256-bit cryptographically secure token injected at deployment
  gateway-token-secret: "${GATEWAY_TOKEN_SECRET}"
  
  # RSA Cryptographic private pem payload - Injected via TLS secret or ExternalSecret CSI
  rsa-private-key: "${RSA_PRIVATE_KEY_PEM}"
