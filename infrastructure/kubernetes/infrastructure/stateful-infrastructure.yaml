apiVersion: v1
kind: Namespace
metadata:
  name: easychat-infra
  labels:
    name: easychat-infra
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: easychat-infra
type: Opaque
stringData:
  POSTGRES_USER: "nearby_user"
  POSTGRES_PASSWORD: "nearby_secure_pass"
  POSTGRES_DB: "nearby_connect"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: easychat-infra
data:
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://nearby-kafka.easychat-infra.svc.cluster.local:9092"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:9093"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nearby-postgres
  namespace: easychat-infra
  labels:
    app.kubernetes.io/name: nearby-postgres
    app.kubernetes.io/part-of: easychat
spec:
  serviceName: nearby-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nearby-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nearby-postgres
    spec:
      containers:
      - name: postgres
        image: postgis/postgis:16-3.4-alpine
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: postgres-secrets
        ports:
        - name: postgres
          containerPort: 5432
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "nearby_user", "-d", "nearby_connect"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "nearby_user", "-d", "nearby_connect"]
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: nearby-postgres
  namespace: easychat-infra
  labels:
    app.kubernetes.io/name: nearby-postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app.kubernetes.io/name: nearby-postgres
---
# Redis StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nearby-redis
  namespace: easychat-infra
  labels:
    app.kubernetes.io/name: nearby-redis
    app.kubernetes.io/part-of: easychat
spec:
  serviceName: nearby-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nearby-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nearby-redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        imagePullPolicy: IfNotPresent
        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: redis-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 500Mi
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: nearby-redis
  namespace: easychat-infra
  labels:
    app.kubernetes.io/name: nearby-redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app.kubernetes.io/name: nearby-redis
---
# Kafka StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nearby-kafka
  namespace: easychat-infra
  labels:
    app.kubernetes.io/name: nearby-kafka
    app.kubernetes.io/part-of: easychat
spec:
  serviceName: nearby-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nearby-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nearby-kafka
    spec:
      containers:
      - name: kafka
        image: apache/kafka:3.7.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: kafka-config
        env:
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx256M -Xms256M"
        ports:
        - name: kafka
          containerPort: 9092
        - name: controller
          containerPort: 9093
        resources:
          requests:
            cpu: 150m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 768Mi
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: kafka-data
          mountPath: /tmp/kraft-combined-logs
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 2Gi
---
# Kafka Service
apiVersion: v1
kind: Service
metadata:
  name: nearby-kafka
  namespace: easychat-infra
  labels:
    app.kubernetes.io/name: nearby-kafka
spec:
  type: ClusterIP
  ports:
  - port: 9092
    targetPort: 9092
    name: kafka
  - port: 9093
    targetPort: 9093
    name: controller
  selector:
    app.kubernetes.io/name: nearby-kafka
---
# Network Policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-easychat-infra
  namespace: easychat-infra
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector: {}
  policyTypes:
  - Ingress
