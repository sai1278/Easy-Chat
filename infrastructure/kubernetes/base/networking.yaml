---
# ============================================================
# ClusterIssuer: self-signed (local Kind cluster)
# For production, replace with letsencrypt-prod + ACME
# ============================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
spec:
  selfSigned: {}

---
# ============================================================
# Certificate: easychat.local TLS (self-signed for Kind)
# ============================================================
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: easychat-tls-cert
  namespace: default
spec:
  secretName: easychat-tls-cert
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
  commonName: easychat.local
  dnsNames:
    - easychat.local
    - "*.easychat.local"
  duration: 8760h   # 1 year
  renewBefore: 720h # renew 30 days before expiry

---
# ============================================================
# Ingress: easychat-ingress (corrected service ports)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easychat-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - easychat.local
      secretName: easychat-tls-cert
  rules:
    - host: easychat.local
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8090
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081
          - path: /api/v1/user
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8082
          - path: /api/v1/presence
            pathType: Prefix
            backend:
              service:
                name: presence-service
                port:
                  number: 8083
          - path: /api/v1/chat
            pathType: Prefix
            backend:
              service:
                name: chat-service
                port:
                  number: 8084
          - path: /api/v1/nearby
            pathType: Prefix
            backend:
              service:
                name: nearby-service
                port:
                  number: 8085
          - path: /api/v1/notification
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8086
          - path: /api/v1/media
            pathType: Prefix
            backend:
              service:
                name: media-service
                port:
                  number: 8087
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8090

---
# ============================================================
# NetworkPolicy: default-deny-ingress (default namespace)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# ============================================================
# NetworkPolicy: allow-ingress-nginx-to-services
# Permits ingress-nginx controller to reach all app pods
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx-to-services
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
        - port: 8081
        - port: 8082
        - port: 8083
        - port: 8084
        - port: 8085
        - port: 8086
        - port: 8087
        - port: 8090

---
# ============================================================
# NetworkPolicy: allow-inter-service (app pods talk to each other)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inter-service
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
        - podSelector: {}

---
# ============================================================
# NetworkPolicy: allow-egress-all (app pods can reach infra + internet)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-all
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}
