## kube-prometheus-stack values for Kind/local cluster
## Optimized for resource-constrained environments

fullnameOverride: prometheus

## Alertmanager
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

## Grafana — disabled here, deployed separately for datasource control
grafana:
  enabled: false

## Prometheus Operator
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

## Prometheus Server
prometheus:
  enabled: true
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    ## Scrape all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    ## Additional scrape configs for easychat services
    additionalScrapeConfigs:
      - job_name: 'easychat-gateway'
        static_configs:
          - targets: ['api-gateway.default.svc.cluster.local:8090']
        metrics_path: '/metrics'
        scrape_interval: 15s
      - job_name: 'easychat-auth'
        static_configs:
          - targets: ['auth-service.default.svc.cluster.local:8081']
        metrics_path: '/metrics'
        scrape_interval: 15s
      - job_name: 'easychat-user'
        static_configs:
          - targets: ['user-service.default.svc.cluster.local:8082']
        metrics_path: '/metrics'
        scrape_interval: 15s
      - job_name: 'easychat-presence'
        static_configs:
          - targets: ['presence-service.default.svc.cluster.local:8083']
        metrics_path: '/metrics'
        scrape_interval: 15s
      - job_name: 'easychat-chat'
        static_configs:
          - targets: ['chat-service.default.svc.cluster.local:8084']
        metrics_path: '/metrics'
        scrape_interval: 15s
      - job_name: 'easychat-nearby'
        static_configs:
          - targets: ['nearby-service.default.svc.cluster.local:8085']
        metrics_path: '/metrics'
        scrape_interval: 15s
      - job_name: 'easychat-notification'
        static_configs:
          - targets: ['notification-service.default.svc.cluster.local:8086']
        metrics_path: '/metrics'
        scrape_interval: 15s
      - job_name: 'easychat-media'
        static_configs:
          - targets: ['media-service.default.svc.cluster.local:8087']
        metrics_path: '/metrics'
        scrape_interval: 15s

## NodeExporter
nodeExporter:
  enabled: true

## kube-state-metrics
kubeStateMetrics:
  enabled: true

## Default rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
