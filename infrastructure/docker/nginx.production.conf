events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upstream to Easy Chat API Gateway container on internal Docker network
    upstream easychat_gateway {
        server gateway:8090;
        keepalive 32;
    }

    # HTTP Server: Let's Encrypt ACME challenge + HTTP to HTTPS redirection
    server {
        listen 80;
        listen [::]:80;
        server_name api.easychat.com;

        # ACME challenge directory for automated Certbot TLS renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server: TLS Termination for REST API and WebSocket stream
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.easychat.com;

        # TLS Certificates (mounted from Let's Encrypt / Certbot directory)
        ssl_certificate /etc/letsencrypt/live/api.easychat.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.easychat.com/privkey.pem;

        # Modern hardened SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS (Strict-Transport-Security)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        client_max_body_size 20M;

        # WebSocket Signaling Endpoint (WSS: wss://api.easychat.com/ws)
        location /ws {
            proxy_pass http://easychat_gateway/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Extended timeouts for persistent Double Ratchet chat streaming
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REST API Gateway Endpoint (HTTPS: https://api.easychat.com/api/v1/)
        location /api/v1/ {
            proxy_pass http://easychat_gateway/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Health probe endpoint
        location /healthz {
            proxy_pass http://easychat_gateway/healthz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
