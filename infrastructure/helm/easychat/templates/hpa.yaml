{{- range $name, $svc := .Values.services }}
{{- if or (eq $name "gateway") (eq $name "auth") (eq $name "chat") (eq $name "nearby") }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svc.name }}-hpa
  namespace: {{ $.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svc.name }}
  minReplicas: {{ $svc.replicas }}
  maxReplicas: {{ mul $svc.replicas 3 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
{{- end }}
{{- end }}
