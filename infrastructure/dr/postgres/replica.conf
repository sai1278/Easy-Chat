# PostgreSQL Replica Configuration for Multi-Region Replication
hot_standby = on
max_standby_archive_delay = 30s
max_standby_streaming_delay = 30s
wal_receiver_status_interval = 10s
hot_standby_feedback = on
primary_conninfo = 'host=postgres-primary.us-east1.svc.cluster.local port=5432 user=replicator password=ReplicaPassword123! sslmode=require'
primary_slot_name = 'secondary_region_slot'
recovery_target_timeline = 'latest'
