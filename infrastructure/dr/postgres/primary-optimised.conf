# PostgreSQL Cost-Optimised Primary Configuration
# Extends primary.conf with tuned memory/IO parameters.
#
# Sizing Context:
#  - Workload: OLTP (chat messages, user records, nearby discovery)
#  - Baseline: db.r6g.large (2 vCPU, 16GB) — OVER-PROVISIONED for typical chat scale
#  - Recommendation: Rightsize to db.r6g.medium (2 vCPU, 8GB) in managed RDS/CloudSQL
#    → saves ~45% instance cost ($180/mo → $99/mo on RDS)
#  - Or: Use Cloud SQL for PostgreSQL g1-small → db-n1-standard-2 depending on QPS

# ── Replication (from primary.conf) ──────────────────────────────────────────
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
max_wal_senders = 5       # was 10 — only 1 replica per region; 5 allows room for logical slots
wal_keep_size = 256MB     # was 1024MB — 75% reduction; PITR via archive covers the rest
hot_standby = on
checkpoint_timeout = 10min # was 5min — less frequent checkpoints = lower IOPS cost
max_replication_slots = 3  # was 5 — reduced to match actual slot count
log_replication_commands = on

# ── Memory Tuning (OLTP right-sizing for 8GB instance) ───────────────────────
shared_buffers = 2GB              # 25% of RAM (8GB instance)
effective_cache_size = 6GB        # ~75% of RAM
work_mem = 16MB                   # per-connection sort/hash; 16MB * 100 connections = 1.6GB max
maintenance_work_mem = 256MB      # VACUUM, CREATE INDEX — generous for maintenance
wal_buffers = 64MB                # Flush WAL efficiently

# ── Connection Pooling ─────────────────────────────────────────────────────────
# Use PgBouncer in transaction mode rather than max_connections = 200+
# Each idle Postgres connection costs ~5-10MB; pooling reduces instance sizing needs
max_connections = 100             # PgBouncer pools to this; was likely unset (default 100)

# ── IO / Storage Cost Optimisation ───────────────────────────────────────────
# Use WAL compression to reduce archive storage bandwidth costs
wal_compression = on              # Compresses WAL segments (~30-50% smaller archives)
full_page_writes = on             # Required for crash safety; cannot disable
checkpoint_completion_target = 0.9 # Spread checkpoint IO over 90% of interval

# ── Autovacuum Tuning (prevent table bloat = avoids storage cost creep) ────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_vacuum_cost_delay = 2ms  # Faster autovacuum = less table bloat
autovacuum_vacuum_scale_factor = 0.05  # Trigger on 5% dead tuples (lower than default 20%)
autovacuum_analyze_scale_factor = 0.02

# ── Logging (reduce log storage cost) ────────────────────────────────────────
log_min_duration_statement = 500   # Only log queries > 500ms (reduces log volume)
log_checkpoints = on
log_connections = off              # Disable in production to reduce log storage
log_disconnections = off
log_lock_waits = on

# ── Archive Cost Control ──────────────────────────────────────────────────────
# Implement S3 lifecycle rules on archive bucket:
#   0-7 days:   S3 Standard ($0.023/GB/mo)
#   7-30 days:  S3 Standard-IA ($0.0125/GB/mo)
#   30-90 days: S3 Glacier Instant ($0.004/GB/mo)
#   90+ days:   S3 Glacier Deep Archive ($0.00099/GB/mo) or DELETE
# See: infrastructure/storage/s3-lifecycle.json for IaC definition
