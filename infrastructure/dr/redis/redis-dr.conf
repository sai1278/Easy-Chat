# Redis Disaster Recovery Configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots Backup Configuration
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Cross-Region Replica Configuration
# Enabled dynamically on the secondary region node
# replicaof redis-primary.us-east1.svc.cluster.local 6379
replica-read-only yes
replica-serve-stale-data yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
repl-backlog-size 64mb
