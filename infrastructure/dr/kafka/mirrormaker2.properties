# MirrorMaker 2 Cost-Optimised Cross-Region Replication Configuration
#
# Cost Analysis (baseline):
#  - tasks.max = 4: Over-provisioned for 3 topics × 3 partitions each
#  - No compression: Significant cross-region bandwidth spend
#  - No offset sync interval: Triggers continuous commits
#
# Optimisations:
#  - Reduced tasks.max 4 → 2 (sufficient for 3 low-volume topics)
#  - Added lz4 compression (reduces cross-region egress by ~40-60%)
#  - Added offset sync interval 10s → reduces Kafka control-plane writes
#  - Added heartbeat interval tuning

clusters = primary, secondary

# Define bootstrap servers
primary.bootstrap.servers = kafka-primary.us-east1.svc.cluster.local:9092
secondary.bootstrap.servers = kafka-secondary.us-west1.svc.cluster.local:9092

# Define replication flow (Primary → Secondary)
primary->secondary.enabled = true
primary->secondary.topics = chat-messages, user-events, presence-alerts
primary->secondary.groups = .*
primary->secondary.emit.heartbeats = true
primary->secondary.emit.checkpoints = true
primary->secondary.sync.group.offsets.enabled = true
primary->secondary.sync.group.offsets.interval.seconds = 10   # NEW: was continuous
primary->secondary.sync.topic.acls.enabled = true

# ── Cost-Optimised Connector Config ──────────────────────────────────────────
primary->secondary.tasks.max = 2         # was 4 — sufficient for 3 topics, saves 2 task threads

# ── Compression (Critical: reduces cross-region egress cost 40-60%) ───────────
primary->secondary.producer.override.compression.type = lz4
# lz4 chosen: best CPU-efficiency tradeoff; zstd provides higher compression
# but adds CPU cost on Kafka broker; lz4 better for real-time chat payloads

# ── Heartbeat Tuning ──────────────────────────────────────────────────────────
primary->secondary.heartbeats.topic.replication.factor = 1   # Internal topic; no need for RF=3
primary->secondary.checkpoints.topic.replication.factor = 1

# ── Connector Configurations ──────────────────────────────────────────────────
replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy
sync.topic.configs.enabled = true

# ── Kafka Broker Sizing Recommendation ───────────────────────────────────────
# Current assumption: 3 brokers per region (standard HA)
# For 3 topics × 3 partitions × 3 replicas = ~27 partition-replicas total
# Recommendation:
#  - Primary:   3 x kafka.2xlarge → 3 x kafka.xlarge (-50% cost)
#    Only scale to 2xlarge if msg throughput exceeds 100MB/s sustained
#  - Secondary: 3 x kafka.large (DR replica; read-only consumer path only)
#
# Topic Partition Right-Sizing:
#  chat-messages:   12 partitions → 6 partitions (unless >50k concurrent users)
#  user-events:     6 partitions  → 3 partitions (low-volume profile updates)
#  presence-alerts: 6 partitions  → 3 partitions (heartbeat events; small payloads)
#
# Retention Right-Sizing:
#  chat-messages:   7 days retention, 10GB segment size
#  user-events:     3 days retention (consumed immediately by notification service)
#  presence-alerts: 1 day retention (real-time heartbeat; stale data valueless)
