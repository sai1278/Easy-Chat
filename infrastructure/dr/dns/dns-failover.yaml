apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-failover-policy
  namespace: kube-system
data:
  routing-policy.json: |
    {
      "DomainName": "api.easychat.local",
      "RoutingType": "FAILOVER",
      "TTL": 30,
      "Endpoints": [
        {
          "Region": "us-east1",
          "IP": "10.100.10.50",
          "Weight": 100,
          "Role": "PRIMARY",
          "HealthCheck": {
            "Path": "/healthz",
            "Port": 443,
            "IntervalSeconds": 5,
            "FailureThreshold": 3
          }
        },
        {
          "Region": "us-west1",
          "IP": "10.200.20.50",
          "Weight": 0,
          "Role": "SECONDARY",
          "HealthCheck": {
            "Path": "/healthz",
            "Port": 443,
            "IntervalSeconds": 5,
            "FailureThreshold": 3
          }
        }
      ]
    }
