global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"
  - "compliance-alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["gateway-service:8080"]

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: "chat-service"
    static_configs:
      - targets: ["chat-service:8082"]

  - job_name: "nearby-service"
    static_configs:
      - targets: ["nearby-service:8083"]

  - job_name: "presence-service"
    static_configs:
      - targets: ["presence-service:8084"]

  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:8085"]

  - job_name: "media-service"
    static_configs:
      - targets: ["media-service:8086"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:8087"]
