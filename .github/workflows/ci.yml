# Production CI/CD & Quality Verification Workflow
name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-build:
    name: Go Microservices Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify Go Modules & Workspace
        run: |
          go work sync

      - name: Run Go Unit Tests
        run: |
          go test ./apps/backend/shared/... ./apps/backend/services/gateway/... ./apps/backend/services/auth/... ./apps/backend/services/user/... ./apps/backend/services/chat/... ./apps/backend/services/nearby/... ./apps/backend/services/presence/... ./apps/backend/services/media/... ./apps/backend/services/notification/... -v

      - name: Build Microservice Binaries
        run: |
          mkdir -p bin
          go build -o bin/gateway ./apps/backend/services/gateway/cmd/gateway
          go build -o bin/auth ./apps/backend/services/auth/cmd/auth
          go build -o bin/user ./apps/backend/services/user/cmd/user
          go build -o bin/chat ./apps/backend/services/chat/cmd/chat
          go build -o bin/nearby ./apps/backend/services/nearby/cmd/nearby
          go build -o bin/presence ./apps/backend/services/presence/cmd/presence
          go build -o bin/media ./apps/backend/services/media/cmd/media
          go build -o bin/notification ./apps/backend/services/notification/cmd/notification

  frontend-quality-and-build:
    name: Flutter Application Analysis & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Unit Tests
        run: flutter test

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --no-tree-shake-icons --dart-define=APP_ENV=production

      - name: Clean Keystore Artifacts
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
