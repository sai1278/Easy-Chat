name: Reusable Docker Builder

on:
  workflow_call:
    inputs:
      service:
        description: 'Target microservice name'
        required: true
        type: string
      image_tag:
        description: 'Output image tag'
        required: true
        type: string
    outputs:
      image_digest:
        description: 'Output SHA256 image digest'
        value: ${{ jobs.build-image.outputs.digest }}

jobs:
  build-image:
    name: Compile and Sign Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Service Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.backend
          build-args: |
            SERVICE_NAME=${{ inputs.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ inputs.service }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Image Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/${{ inputs.service }}:${{ inputs.image_tag }}'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: 'ghcr.io/${{ github.repository }}/${{ inputs.service }}:${{ inputs.image_tag }}'
          format: 'spdx-json'
          output-file: 'sbom-${{ inputs.service }}.spdx.json'

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: 'ghcr.io/${{ github.repository }}/${{ inputs.service }}:${{ inputs.image_tag }}'
          format: 'cyclonedx-json'
          output-file: 'sbom-${{ inputs.service }}.cdx.json'

      - name: Sign Docker Image
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}/${{ inputs.service }}@${{ steps.build-push.outputs.digest }}"

      - name: Attest SBOM to Image
        run: |
          cosign attest --yes \
            --predicate sbom-${{ inputs.service }}.spdx.json \
            --type spdxjson \
            "ghcr.io/${{ github.repository }}/${{ inputs.service }}@${{ steps.build-push.outputs.digest }}"
