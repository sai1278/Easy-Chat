syntax = "proto3";

package nearby.v1;

option go_package = "nearby/backend/internal/gen/v1;genv1";

service AuthService {
  rpc GenerateAnonymousSession(GenerateAnonymousSessionRequest) returns (GenerateAnonymousSessionResponse);
}

message GenerateAnonymousSessionRequest {
  string device_challenge = 1;
}

message GenerateAnonymousSessionResponse {
  string token = 1;
  string pseudonym = 2;
  string avatar_id = 3;
  int64 expires_at = 4;
}
