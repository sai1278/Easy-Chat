syntax = "proto3";

package nearby.v1;

option go_package = "nearby/backend/internal/gen/v1;genv1";

import "google/protobuf/timestamp.proto";

service ModerationService {
  rpc ReportUser (ReportUserRequest) returns (ReportUserResponse);
  rpc BlockUser (BlockUserRequest) returns (BlockUserResponse);
  rpc UnblockUser (UnblockUserRequest) returns (UnblockUserResponse);
  rpc GetBlockList (GetBlockListRequest) returns (GetBlockListResponse);
}

message ReportUserRequest {
  string reporter_user_id = 1;
  string offender_user_id = 2;
  string reason = 3;
  string chat_session_id = 4;
}

message ReportUserResponse {
  string report_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message BlockUserRequest {
  string blocker_user_id = 1;
  string blocked_user_id = 2;
}

message BlockUserResponse {
  bool success = 1;
  google.protobuf.Timestamp created_at = 2;
}

message UnblockUserRequest {
  string blocker_user_id = 1;
  string blocked_user_id = 2;
}

message UnblockUserResponse {
  bool success = 1;
}

message GetBlockListRequest {
  string user_id = 1;
}

message GetBlockListResponse {
  repeated string blocked_user_ids = 1;
}
