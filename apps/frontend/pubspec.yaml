name: nearby_frontend
description: "Nearby Connect - Ephemeral Proximity Chat Client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  protobuf: ^3.1.0
  grpc: ^3.2.4
  dio: ^5.4.0
  go_router: ^13.2.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.1
  web_socket_channel: ^2.4.1
  geolocator: ^10.1.0
  flutter_reactive_ble: ^5.0.2
  flutter_secure_storage: ^8.0.0
  http: ^0.13.6
  crypto: ^3.0.2
  cryptography: ^2.9.0
  image_picker: ^1.1.2
  record: ^4.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  reactive_ble_platform_interface: 5.4.1

