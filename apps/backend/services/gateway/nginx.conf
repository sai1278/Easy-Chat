user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Custom log format to include $request_id for trace tracking
    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_status":"$upstream_status"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    sendfile on;
    keepalive_timeout 65;

    # Rate Limiting: 10 requests per second with 20 burst per client IP
    limit_req_zone $binary_remote_addr zone=api_limit_zone:10m rate=10r/s;

    # Enable Gzip response compression for network efficiency
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # =====================================================
    # Upstream clusters (Load Balancing & Circuit Breakers)
    # =====================================================
    upstream auth_service {
        server auth-service-1:8081 max_fails=3 fail_timeout=10s;
        server auth-service-2:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream user_service {
        server user-service-1:8082 max_fails=3 fail_timeout=10s;
        server user-service-2:8082 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream chat_service {
        server chat-service-1:8083 max_fails=3 fail_timeout=10s;
        server chat-service-2:8083 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream nearby_service {
        server nearby-service-1:8084 max_fails=3 fail_timeout=10s;
        server nearby-service-2:8084 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream presence_service {
        server presence-service-1:8085 max_fails=3 fail_timeout=10s;
        server presence-service-2:8085 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # =====================================================
    # HTTPS Server (TLS Termination & Security Hardening)
    # =====================================================
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name easychat.local;

        # SSL Certificates
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        # TLS Hardening configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;

        # Request ID injection for downstream tracing
        add_header X-Request-ID $request_id always;

        # Request validation: maximum client request body size (prevent large payload DDoS)
        client_max_body_size 10M;

        # Apply global rate limiting to all API requests
        limit_req zone=api_limit_zone burst=20 nodelay;

        # =====================================================
        # API Routes (Reverse Proxy Routing)
        # =====================================================

        # Auth Service
        location /api/v1/auth/ {
            proxy_pass http://auth_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # User Service
        location /api/v1/user/ {
            proxy_pass http://user_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Chat WebSocket & HTTP Service
        location /api/v1/chat/ {
            proxy_pass http://chat_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Nearby Service
        location /api/v1/nearby/ {
            proxy_pass http://nearby_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Presence Service
        location /api/v1/presence/ {
            proxy_pass http://presence_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Healthcheck
        location /healthz {
            access_log off;
            return 200 "ok";
        }
    }

    # Redirect all HTTP requests to HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
